<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Brain Dump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Brain Dump</h1>
      <button type="button" class="link-btn" id="logoutBtn" hidden>Log out</button>
    </header>

    <!-- Password screen (shown until a valid password is stored on this device) -->
    <form class="login" id="login" hidden novalidate>
      <label for="passwordInput" class="login__label">Password</label>
      <input type="password" id="passwordInput" class="login__input" autocomplete="current-password"
             autocapitalize="off" spellcheck="false" required>
      <p class="login__error" id="loginError" role="alert" hidden></p>
      <button type="submit" class="btn btn--primary" id="loginBtn">Unlock</button>
    </form>

    <div id="appContent" hidden>
    <!-- ===== Record view ===== -->
    <div class="view" id="view-record">
    <!-- Recorder: idle / recording / processing -->
    <section class="recorder" id="recorder" aria-live="polite">
      <button type="button" class="record-btn" id="recordBtn" aria-label="Start recording">
        <span class="record-btn__icon" aria-hidden="true"></span>
      </button>
      <p class="recorder__status" id="status">Tap to record</p>
      <p class="recorder__timer" id="timer" hidden>0:00 <span class="muted">/ 10:00</span></p>
      <div class="spinner" id="spinner" hidden aria-hidden="true"></div>
    </section>

    <!-- Error -->
    <section class="error" id="error" role="alert" hidden>
      <p class="error__message" id="errorMessage"></p>
      <div class="actions">
        <button type="button" class="btn btn--primary" id="retryBtn">Retry</button>
        <button type="button" class="btn" id="discardBtn">Discard &amp; record again</button>
      </div>
    </section>

    <!-- Result -->
    <section class="result" id="result" hidden>
      <p class="save-status" id="saveStatus" role="status" hidden></p>
      <div class="actions">
        <button type="button" class="btn btn--primary" id="copyBtn">Copy all</button>
        <button type="button" class="btn" id="newBtn">New recording</button>
      </div>
      <div id="resultBody"></div>
      <details class="transcript" id="transcriptBox">
        <summary>Full transcript</summary>
        <p id="transcript" dir="auto"></p>
      </details>
      <p class="model-info" id="modelInfo" hidden></p>
    </section>
    </div>

    <!-- ===== Tasks view ===== -->
    <div class="view" id="view-tasks" hidden>
      <div class="view-header">
        <h2 class="view-title">Tasks</h2>
        <label class="toggle">
          <input type="checkbox" id="showCompleted"> Show completed
        </label>
      </div>
      <p class="view-message" id="tasksMessage" role="status" hidden></p>
      <div id="tasksList"></div>
    </div>

    <!-- ===== History view ===== -->
    <div class="view" id="view-history" hidden>
      <div id="historyListView">
        <div class="view-header"><h2 class="view-title">History</h2></div>
        <p class="view-message" id="historyMessage" role="status" hidden></p>
        <ul class="history-list" id="historyList"></ul>
        <button type="button" class="btn btn--block" id="loadMoreBtn" hidden>Load more</button>
      </div>

      <div id="dumpDetail" hidden>
        <div class="view-header">
          <button type="button" class="link-btn" id="backBtn">‹ History</button>
        </div>
        <p class="detail-meta" id="detailMeta"></p>
        <p class="view-message" id="detailMessage" role="status" hidden></p>
        <div id="detailBody"></div>
        <details class="transcript" id="detailTranscriptBox">
          <summary>Full transcript</summary>
          <p id="detailTranscript" dir="auto"></p>
        </details>
        <div class="danger-zone">
          <button type="button" class="btn btn--danger" id="deleteBtn">Delete this dump</button>
          <div class="confirm" id="deleteConfirm" hidden>
            <p id="deleteConfirmText">Delete this dump and all its items? This can't be undone.</p>
            <div class="actions">
              <button type="button" class="btn btn--danger" id="deleteYesBtn">Delete</button>
              <button type="button" class="btn" id="deleteNoBtn">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Bottom tab bar ===== -->
    <nav class="tabbar" aria-label="Views">
      <button type="button" class="tabbar__btn" data-tab="record" aria-current="page">Record</button>
      <button type="button" class="tabbar__btn" data-tab="tasks">Tasks</button>
      <button type="button" class="tabbar__btn" data-tab="history">History</button>
    </nav>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
